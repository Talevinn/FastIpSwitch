[package]
name = "fastipswitch"
version = "0.1.0"
edition = "2024"
description = "Changement rapide d'adresse IPv4 et gestion d'IP virtuelles via netsh"
authors = ["Valentin PICARD"]
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1.0.105"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.19.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "system-tray",
] }
toml = "1.2.3"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[build-dependencies]
slint-build = "1.19.1"
winresource = "0.1.34"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
